---
name: pytest

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up mise toolchain
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Install Playwright WebKit
        run: |
          mise exec -- playwright install --with-deps webkit
      - name: Running pytest
        run: |
          mise run test
