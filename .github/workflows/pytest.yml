---
name: pytest

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up mise toolchain
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - name: Install Playwright WebKit
        run: |
          uv run playwright install --with-deps webkit
      - name: Running pytest
        run: |
          mise run test
