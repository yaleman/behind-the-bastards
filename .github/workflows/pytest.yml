---
name: pytest

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up mise toolchain
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Install Playwright WebKit
        run: |
          mise exec -- playwright install --with-deps webkit
      - name: Running pytest
        run: |
          mise run test
